name: Production DevSecOps Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jaguarscodehub/devsecops-elk-project

jobs:
  # ==============================================================================
  # JOB 1: SHIFT-LEFT SECURITY AUDIT (Gitleaks Secrets + Semgrep SAST)
  # ==============================================================================
  security-audit:
    name: Shift-Left Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Gitleaks Secret Scanning
      - name: Run Gitleaks Secret Audit
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      # 2. Semgrep SAST Analysis (OWASP Top 10)
      - name: Run Semgrep SAST Scan
        run: |
          docker run --rm -v $(pwd):/src returntocorp/semgrep \
            semgrep scan --config auto --severity ERROR --error /src/src --json -o /src/semgrep-report.json || {
              echo "❌ Semgrep detected high-severity security findings:"
              cat semgrep-report.json
              exit 1
            }

      - name: Upload Semgrep Audit Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 14

  # ==============================================================================
  # JOB 2: DOCKER BUILD & TRIVY CONTAINER SECURITY GATE
  # ==============================================================================
  build-and-scan:
    name: Build & Trivy CVE Scan
    runs-on: ubuntu-latest
    needs: security-audit
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      # Build image locally first to scan with Trivy
      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy Container Vulnerability Scan (Build-blocking gate on HIGH/CRITICAL)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      # Push verified image to GHCR if Trivy scan passes
      - name: Push Vetted Image to GHCR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==============================================================================
  # JOB 3: ZERO-DOWNTIME EC2 DEPLOYMENT & HEALTH SMOKE TEST
  # ==============================================================================
  deploy:
    name: Zero-Downtime EC2 Deployment
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            echo "Deploying update to EC2..."
            
            # Authenticate with GHCR using a personal access token or login
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            cd ~/devsecops-elk-project || cd /opt/secops-guard
            
            # Export image coordinates
            export CI_REGISTRY_IMAGE="ghcr.io/jaguarscodehub/devsecops-elk-project"
            export IMAGE_TAG="latest"
            
            # Pull new app image from GHCR
            docker compose pull app
            
            # Zero-downtime rolling reload: restarts only the app container
            docker compose up -d --no-deps app
            
            # Healthcheck smoke test loop
            echo "Running post-deploy health verification..."
            for i in $(seq 1 12); do
              if curl -s -f http://localhost/health | grep -q 'healthy'; then
                echo "✅ Deployment verified: SecOps App Gateway is healthy and responding!"
                exit 0
              fi
              echo "Waiting for app to become healthy... attempt $i/12"
              sleep 5
            done
            echo "❌ Healthcheck failed: Service did not respond within 60s"
            exit 1
