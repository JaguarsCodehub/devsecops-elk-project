# ==============================================================================
# GitLab CI/CD: Multi-Stage Shift-Left DevSecOps Pipeline
# ==============================================================================

stages:
  - security-audit
  - build-and-scan
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ------------------------------------------------------------------------------
# STAGE 1: SHIFT-LEFT AUDIT (Gitleaks Secrets Scan & Semgrep SAST)
# ------------------------------------------------------------------------------
gitleaks_secrets_scan:
  stage: security-audit
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --verbose --source .

sast_semgrep:
  stage: security-audit
  image: returntocorp/semgrep
  script:
    - semgrep scan --config auto --error

# ------------------------------------------------------------------------------
# STAGE 2: BUILD & CONTAINER SECURITY AUDIT (Trivy Scan)
# ------------------------------------------------------------------------------
build_and_scan:
  stage: build-and-scan
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - apk add --no-cache curl
    # Install Trivy Container Scanner
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    # Authenticate to GitLab Container Registry
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    # Build container image locally
    - docker build -t $CI_REGISTRY_IMAGE:$IMAGE_TAG .
    # Scan image for known vulnerabilities; fail the pipeline on HIGH or CRITICAL issues
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE:$IMAGE_TAG
    # Push vetted image to registry
    - docker push $CI_REGISTRY_IMAGE:$IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:$IMAGE_TAG $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest

# ------------------------------------------------------------------------------
# STAGE 3: AUTOMATED EC2 DEPLOYMENT
# ------------------------------------------------------------------------------
deploy_to_ec2:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh $EC2_USER@$EC2_HOST "
        echo '$CI_JOB_TOKEN' | docker login -u '$CI_REGISTRY_USER' --password-stdin $CI_REGISTRY &&
        cd /opt/secops-guard &&
        export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE &&
        export IMAGE_TAG=$IMAGE_TAG &&
        export REDIS_PASSWORD='$REDIS_PASSWORD' &&
        docker compose pull app &&
        docker compose up -d"
  only:
    - main
