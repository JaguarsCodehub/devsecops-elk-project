# ==============================================================================
# Logstash Pipeline: secops-logs.conf
# Filebeat -> Logstash -> Elasticsearch
# Enriches structured security audit logs and tags threat categories
# ==============================================================================

input {
  beats {
    port => 5044
  }
}

filter {
  # Parse single-line JSON logs emitted by secops-guard
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
      add_tag => [ "json_parsed" ]
    }
  }

  if [app] {
    mutate {
      rename => {
        "[app][level]"          => "log_level"
        "[app][service]"        => "service"
        "[app][message]"        => "log_message"
        "[app][eventType]"      => "event_type"
        "[app][severity]"       => "severity"
        "[app][ip]"             => "client_ip"
        "[app][path]"           => "http_path"
        "[app][action]"         => "security_action"
        "[app][username]"       => "target_user"
        "[app][security_event]" => "is_security_event"
      }
    }

    # Align timestamp with when the event actually occurred in the app
    if [app][@timestamp] {
      date {
        match => [ "[app][@timestamp]", "ISO8601" ]
        target => "@timestamp"
      }
    }
  }

  # Tag critical threats for easy Kibana dashboard alerting
  if [severity] == "CRITICAL" {
    mutate { add_tag => [ "critical_threat" ] }
  } else if [severity] == "HIGH" {
    mutate { add_tag => [ "high_threat" ] }
  }

  # Clean up noisy metadata to keep Elasticsearch indices lightweight
  mutate {
    remove_field => [
      "@version", "agent", "ecs", "input", "app",
      "docker",
      "event",
      "[container][labels]",
      "[container][image]",
      "[log][file][device_id]", "[log][file][inode]", "[log][file][fingerprint]",
      "[log][offset]",
      "[host][name]"
    ]
  }
}

output {
  elasticsearch {
    hosts              => [ "${ES_HOST}" ]
    ssl_enabled        => false
    index              => "secops-logs-%{+YYYY.MM.dd}"
    manage_template    => true
    template           => "/usr/share/logstash/templates/secops-template.json"
    template_name      => "secops-logs"
    template_overwrite => true
  }
}
